name: sync-registration
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2026-competition
          fetch-depth: 0
          persist-credentials: false
      - name: push competition branch
        env:
          GH_TOKEN: ${{ secrets.REG_PUSH }}
        run: |
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" push https://github.com/miruikediyikeai/oceanbase-seekdb.git HEAD:refs/heads/2026-competition
